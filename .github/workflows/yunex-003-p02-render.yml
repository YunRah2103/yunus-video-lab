name: YUNEX 003 P02 native visual

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - sol/y003-p02-render
    paths:
      - '.github/workflows/yunex-003-p02-render.yml'
      - 'yunex/video003/render/**'
      - 'yunex/video003/reports/P02-G/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'selftest, benchmark or full'
        required: true
        default: selftest
        type: choice
        options: [selftest, benchmark, full]
      render_source_sha:
        description: 'Manager-approved exact 40-character P02 source SHA'
        required: false
        default: ''
        type: string

concurrency:
  group: y003-p02-native-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  EXPECTED_MODEL_SHA256: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      source_sha: ${{ steps.cfg.outputs.source_sha }}
      chunk_size: ${{ steps.cfg.outputs.chunk_size }}
      milestones: ${{ steps.cfg.outputs.milestones }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - id: cfg
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.render_source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          r=json.loads(Path("pipeline/yunex/video003/render/request.json").read_text())
          if r.get("phase") != "Y003-POLISH-02": raise SystemExit("wrong phase")
          if r.get("composition") != "YUNEX-003-VISUAL": raise SystemExit("P02 native chunks must use YUNEX-003-VISUAL")
          if int(r.get("total_frames",0)) != 735: raise SystemExit("P02 requires 735 frames")
          if os.environ["EVENT"] == "workflow_dispatch":
              mode=os.environ.get("INPUT_MODE") or "selftest"
              source=(os.environ.get("INPUT_SOURCE") or r.get("render_source_sha") or "").strip()
          else:
              m=os.environ.get("MESSAGE","")
              mode="full" if "[p02-native-full]" in m else ("benchmark" if "[p02-native-benchmark]" in m else "selftest")
              source=(r.get("render_source_sha") or "").strip()
          if mode in {"benchmark","full"} and not re.fullmatch(r"[0-9a-fA-F]{40}",source):
              raise SystemExit("benchmark/full requires exact 40-char source SHA")
          chunk=int(r.get("chunk_size",20))
          if chunk < 1: raise SystemExit("invalid chunk size")
          milestones=str(r.get("milestone_frames",""))
          vals=[int(x) for x in milestones.split(",") if x.strip()]
          if len(vals)!=7 or len(set(vals))!=7 or min(vals)<0 or max(vals)>=735:
              raise SystemExit("invalid milestone set")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"mode={mode}\nsource_sha={source}\nchunk_size={chunk}\nmilestones={milestones}\n")
          PY

  selftest:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - name: Validate render tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pipeline/yunex/video003/render/*.py
          matrix="$(python pipeline/yunex/video003/render/make_chunk_matrix.py 735 20)"
          python - "$matrix" <<'PY'
          import json,sys
          rows=json.loads(sys.argv[1])["include"]
          assert len(rows)==37
          assert rows[0]["frames"]=="0-19"
          assert rows[-1]["frames"]=="720-734"
          assert sum(x["count"] for x in rows)==735
          print("matrix PASS")
          PY
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path("pipeline/yunex/video003/render/request.json").read_text())
          assert r["phase"]=="Y003-POLISH-02"
          assert r["composition"]=="YUNEX-003-VISUAL"
          assert r["total_frames"]==735
          lock=json.loads(Path("pipeline/yunex/video003/render/approved-audio-lock.json").read_text())
          assert lock["duration_seconds"]==24.5
          assert lock["codec"]=="aac" and lock["sample_rate_hz"]==48000 and lock["channels"]==2
          assert len(lock["approved_audio_sha256"])==64
          print("request/audio lock PASS")
          PY
          bash -n pipeline/yunex/video003/render/mux-approved-audio.sh

  benchmark:
    needs: [config,selftest]
    if: needs.config.outputs.mode == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/yunex/package-lock.json
      - name: Verify exact source and model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          test "$(sha256sum source/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$EXPECTED_MODEL_SHA256"
          mkdir -p source/yunex/public source/yunex/out/y003-p02-benchmark
          cp source/cars/porsche-911-gt3-rs-992/model.glb source/yunex/public/model.glb
      - name: Install runtime
        working-directory: source/yunex
        run: npm ci --no-audit --no-fund
      - name: Render 3 native visual frames
        working-directory: source/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o out/y003-p02-benchmark/resource_usage.txt \
            npx remotion render src/index.tsx YUNEX-003-VISUAL out/y003-p02-benchmark/native-0000-0002.mp4 \
            --frames=0-2 --gl=swangle --concurrency=2 --codec=h264 --pixel-format=yuv420p \
            --crf=14 --scale=1 --timeout=120000 --muted
          printf '%s\n' "${{ needs.config.outputs.source_sha }}" > out/y003-p02-benchmark/source-sha.txt
      - name: Decode and probe benchmark
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -xerror -i source/yunex/out/y003-p02-benchmark/native-0000-0002.mp4 -f null -
          test "$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nw=1:nk=1 source/yunex/out/y003-p02-benchmark/native-0000-0002.mp4)" = "3"
          ffprobe -v error -count_frames -show_streams -of json source/yunex/out/y003-p02-benchmark/native-0000-0002.mp4 > source/yunex/out/y003-p02-benchmark/ffprobe.json
          sha256sum source/yunex/out/y003-p02-benchmark/native-0000-0002.mp4 > source/yunex/out/y003-p02-benchmark/output.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-003-P02-BENCHMARK-${{ needs.config.outputs.source_sha }}
          path: source/yunex/out/y003-p02-benchmark/
          retention-days: 14
          if-no-files-found: error

  matrix:
    needs: [config,selftest]
    if: needs.config.outputs.mode == 'full'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - id: make
        run: python pipeline/yunex/video003/render/make_chunk_matrix.py 735 "${{ needs.config.outputs.chunk_size }}" --github-output "$GITHUB_OUTPUT"

  render:
    needs: [config,matrix]
    if: needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/yunex/package-lock.json
      - name: Verify source and model
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          test "$(sha256sum source/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$EXPECTED_MODEL_SHA256"
          mkdir -p source/yunex/public source/yunex/out/y003-p02
          cp source/cars/porsche-911-gt3-rs-992/model.glb source/yunex/public/model.glb
      - name: Install runtime
        working-directory: source/yunex
        run: npm ci --no-audit --no-fund
      - name: Render exact native visual chunk
        working-directory: source/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        shell: bash
        run: |
          set -euo pipefail
          part="${{ matrix.part }}"
          npx remotion render src/index.tsx YUNEX-003-VISUAL "out/y003-p02/chunk-$part.mp4" \
            --frames="${{ matrix.frames }}" --gl=swangle --concurrency=2 --codec=h264 \
            --pixel-format=yuv420p --crf=14 --scale=1 --timeout=120000 --muted
          printf '%s\n' "${{ needs.config.outputs.source_sha }}" > "out/y003-p02/source-sha-$part.txt"
          sha256sum "out/y003-p02/chunk-$part.mp4" > "out/y003-p02/chunk-$part.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: y003-p02-native-${{ matrix.part }}
          path: source/yunex/out/y003-p02/
          retention-days: 14
          if-no-files-found: error

  assemble:
    needs: [config,matrix,render]
    if: needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: y003-p02-native-*
          path: chunks
          merge-multiple: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate exact chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          python pipeline/yunex/video003/render/validate_chunks.py chunks \
            --total-frames 735 --expected-source "${{ needs.config.outputs.source_sha }}" \
            --allowed-pixel-formats yuv420p,yuvj420p > chunk-manifest.json
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path("chunks").glob("chunk-*.mp4"))
          if len(files)!=37: raise SystemExit(f"expected 37 chunks, got {len(files)}")
          Path("concat.txt").write_text("".join(f"file '{p.resolve()}'\n" for p in files))
          PY
      - name: Concatenate and normalize once to delivery pixel format
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -c copy YUNEX_003_P02_NATIVE_CONCAT.mp4
          ffmpeg -y -v error -i YUNEX_003_P02_NATIVE_CONCAT.mp4 -an \
            -c:v libx264 -preset slow -crf 14 -pix_fmt yuv420p \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -movflags +faststart YUNEX_003_P02_NATIVE_VISUAL.mp4
          python pipeline/yunex/video003/render/validate_export.py YUNEX_003_P02_NATIVE_VISUAL.mp4 --total-frames 735 > visual-validation.json
          ffmpeg -v error -xerror -i YUNEX_003_P02_NATIVE_VISUAL.mp4 -f null -
          sha256sum YUNEX_003_P02_NATIVE_VISUAL.mp4 > visual.sha256
      - name: Extract seven native milestones
        shell: bash
        env:
          RAW: ${{ needs.config.outputs.milestones }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RAW" | tr ',' '\n' > milestones.txt
          mkdir -p review
          i=1
          while read -r frame; do
            ffmpeg -y -v error -i YUNEX_003_P02_NATIVE_VISUAL.mp4 \
              -vf "select=eq(n\,$frame)" -vsync 0 -frames:v 1 \
              "review/milestone-$(printf '%02d' "$i")-frame-$frame.png"
            i=$((i+1))
          done < milestones.txt
          ffmpeg -y -v error -framerate 1 -pattern_type glob -i 'review/milestone-*.png' \
            -vf "scale=270:480,tile=4x2:padding=6:margin=6" -frames:v 1 review/contact-sheet.png
      - name: Write exact-source visual manifest
        shell: bash
        env:
          SOURCE: ${{ needs.config.outputs.source_sha }}
          PIPELINE: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          cm=json.loads(Path("chunk-manifest.json").read_text())
          m={
            "phase":"Y003-POLISH-02",
            "status":"NATIVE_VISUAL_VALIDATED",
            "render_source_sha":os.environ["SOURCE"],
            "pipeline_sha":os.environ["PIPELINE"],
            "workflow_run_id":os.environ["RUN_ID"],
            "composition":"YUNEX-003-VISUAL",
            "width":1080,"height":1920,"scale":1,"fps":30,"frames":735,"duration_seconds":24.5,
            "video_codec":"h264","pixel_format":"yuv420p","normalization_encode":True,
            "intermediate_pixel_formats":cm["observed_pixel_formats"],
            "porsche_sha256":"1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb",
            "visual_sha256":sha("YUNEX_003_P02_NATIVE_VISUAL.mp4"),
            "approved_audio_sha256":"cd411b0dcc9e733f5b142e59f8340f913816e28bf113a32639c4fd12f7ec04c3",
            "audio_mux_stage":"post-render via mux-approved-audio.sh",
            "milestone_frames":[27,144,234,306,492,603,711]
          }
          Path("visual-manifest.json").write_text(json.dumps(m,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-003-P02-NATIVE-VISUAL-${{ needs.config.outputs.source_sha }}
          path: |
            YUNEX_003_P02_NATIVE_VISUAL.mp4
            chunk-manifest.json
            visual-validation.json
            visual-manifest.json
            visual.sha256
            milestones.txt
            review/
          retention-days: 14
          if-no-files-found: error

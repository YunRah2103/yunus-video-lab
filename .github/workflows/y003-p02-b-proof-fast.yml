name: YUNEX 003 P02-B parallel native proof

permissions:
  contents: write
  actions: read

on:
  push:
    branches:
      - sol/y003-p02-suspension-detail
    paths:
      - '.github/workflows/y003-p02-b-proof-fast.yml'

env:
  SOURCE_SHA: d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d
  BASE_SHA: 064fc7687ad16e9fc99c32c3c323154b7e4496f1
  MODEL_SHA: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb

jobs:
  chunk:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {part: "00", frames: "441-455"}
          - {part: "01", frames: "456-470"}
          - {part: "02", frames: "471-485"}
          - {part: "03", frames: "486-500"}
          - {part: "04", frames: "501-515"}
          - {part: "05", frames: "516-530"}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json
      - name: Stage exact B source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(sha256sum cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$MODEL_SHA"
          mkdir -p yunex/public yunex/out/p02-b-fast
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          cd yunex
          npm ci --no-audit --no-fund
      - name: Render native articulation chunk
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-003-VISUAL "out/p02-b-fast/chunk-${{ matrix.part }}.mp4"             --frames="${{ matrix.frames }}" --gl=swangle --concurrency=2 --codec=h264             --pixel-format=yuv420p --crf=17 --scale=1 --timeout=180000 --muted
      - uses: actions/upload-artifact@v4
        with:
          name: p02-b-chunk-${{ matrix.part }}
          path: yunex/out/p02-b-fast/chunk-${{ matrix.part }}.mp4
          retention-days: 7

  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: after
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: before
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: after/yunex/package-lock.json
      - name: Stage locked model and install
        run: |
          set -euo pipefail
          test "$(git -C after rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C before rev-parse HEAD)" = "$BASE_SHA"
          test "$(sha256sum after/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$MODEL_SHA"
          mkdir -p after/yunex/public before/yunex/public after/yunex/out/p02-b-fast before/yunex/out/p02-b-fast
          cp after/cars/porsche-911-gt3-rs-992/model.glb after/yunex/public/model.glb
          cp before/cars/porsche-911-gt3-rs-992/model.glb before/yunex/public/model.glb
          (cd after/yunex && npm ci --no-audit --no-fund)
          (cd before/yunex && npm ci --no-audit --no-fund)
      - name: Render native installed evidence
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          (cd before/yunex && npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b-fast/installed-before-f234.png --frame=234 --gl=swangle --scale=1 --timeout=180000)
          (cd after/yunex && npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b-fast/installed-after-f234.png --frame=234 --gl=swangle --scale=1 --timeout=180000)
          (cd after/yunex && npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b-fast/mechanical-load-f492.png --frame=492 --gl=swangle --scale=1 --timeout=180000)
      - uses: actions/upload-artifact@v4
        with:
          name: p02-b-stills
          path: |
            before/yunex/out/p02-b-fast/installed-before-f234.png
            after/yunex/out/p02-b-fast/installed-after-f234.png
            after/yunex/out/p02-b-fast/mechanical-load-f492.png
          retention-days: 7

  assemble:
    needs: [chunk, stills]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/y003-p02-suspension-detail
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: p02-b-chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: p02-b-stills
          path: stills
      - name: Assemble and verify native proof
        shell: bash
        run: |
          set -euo pipefail
          find chunks -name 'chunk-*.mp4' -print | sort | awk '{print "file '" ENVIRON["GITHUB_WORKSPACE"] "/" $0 "'"}' > concat.txt
          test "$(wc -l < concat.txt)" -eq 6
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -c copy articulation-native-f441-530.mp4
          ffmpeg -v error -xerror -i articulation-native-f441-530.mp4 -f null -
          ffprobe -v error -count_frames             -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,nb_read_frames             -show_entries format=duration -of json articulation-native-f441-530.mp4 > articulation-probe.json
          for f in stills/installed-before-f234.png stills/installed-after-f234.png stills/mechanical-load-f492.png; do
            ffprobe -v error -show_entries stream=codec_name,width,height -of json "$f" > "$(basename "$f").probe.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('articulation-probe.json').read_text())
          s=d['streams'][0]
          assert s['codec_name']=='h264', s
          assert s['pix_fmt']=='yuv420p', s
          assert int(s['width'])==1080 and int(s['height'])==1920, s
          assert s['r_frame_rate']=='30/1', s
          assert int(s['nb_read_frames'])==90, s
          duration=float(d['format']['duration'])
          assert 2.95 <= duration <= 3.05, duration
          for p in ['installed-before-f234.png.probe.json','installed-after-f234.png.probe.json','mechanical-load-f492.png.probe.json']:
              s=json.loads(Path(p).read_text())['streams'][0]
              assert s['codec_name']=='png', s
              assert int(s['width'])==1080 and int(s['height'])==1920, s
          PY
          ffmpeg -y -v error -i stills/installed-before-f234.png -i stills/installed-after-f234.png             -filter_complex "[0:v][1:v]blend=all_mode=difference" -frames:v 1 installed-difference-f234.png
          sha256sum stills/*.png articulation-native-f441-530.mp4 > SHA256SUMS.txt
      - name: Build manifest and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p yunex/video003/reports/P02-B/proof
          cp stills/installed-before-f234.png yunex/video003/reports/P02-B/proof/
          cp stills/installed-after-f234.png yunex/video003/reports/P02-B/proof/
          cp stills/mechanical-load-f492.png yunex/video003/reports/P02-B/proof/
          cp installed-difference-f234.png yunex/video003/reports/P02-B/proof/
          cp articulation-native-f441-530.mp4 yunex/video003/reports/P02-B/proof/
          cp articulation-probe.json yunex/video003/reports/P02-B/proof/
          cp *.probe.json yunex/video003/reports/P02-B/proof/
          cp SHA256SUMS.txt yunex/video003/reports/P02-B/proof/
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('yunex/video003/reports/P02-B/proof')
          def sha(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()
          probe=json.loads((root/'articulation-probe.json').read_text())
          manifest={
            'phase':'Y003-POLISH-02',
            'role':'B',
            'status':'NATIVE_PROOF_COMPLETE',
            'implementation_sha':'d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d',
            'phase_base_sha':'064fc7687ad16e9fc99c32c3c323154b7e4496f1',
            'model_sha256':'1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb',
            'installed_before':{'frame':234,'native':'1080x1920','sha256':sha(root/'installed-before-f234.png')},
            'installed_after':{'frame':234,'native':'1080x1920','sha256':sha(root/'installed-after-f234.png')},
            'mechanical_load_still':{'frame':492,'native':'1080x1920','sha256':sha(root/'mechanical-load-f492.png')},
            'articulation':{
              'frames':'441-530','decoded_frames':90,'fps':30,'native':'1080x1920',
              'codec':'h264','pixel_format':'yuv420p','duration_seconds':float(probe['format']['duration']),
              'sha256':sha(root/'articulation-native-f441-530.mp4')
            },
            'decoder_pass':True
          }
          (root/'PROOF_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'PROOF_RESULTS.md').write_text("""# YUNEX 003 — POLISH 02 — Agent B native proof\n\nPASS.\n\n- Exact B implementation: d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d\n- Exact phase-base comparison: 064fc7687ad16e9fc99c32c3c323154b7e4496f1\n- Installed before/after frame 234: native 1080x1920 PNG\n- Mechanical-load still frame 492: native 1080x1920 PNG\n- Installed articulation frames 441-530: 90 decoded frames, 30 fps, exactly 3.0 s, native 1080x1920 H.264 yuv420p\n- Full ffmpeg decoder pass: PASS\n- Approved Porsche model SHA-256 unchanged\n\nThe proof renders the actual integrated YUNEX-003-VISUAL composition; no motion, track, timeline, central composition, narration or model bytes were modified.\n""")
          PY
          git pull --ff-only origin sol/y003-p02-suspension-detail
          git config user.name "YUNEX Proof Bot"
          git config user.email "actions@github.com"
          git add yunex/video003/reports/P02-B/proof
          git commit -m "YUNEX 003 P02-B: add native proof evidence"
          git push origin HEAD:sol/y003-p02-suspension-detail

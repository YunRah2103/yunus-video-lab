name: YUNEX 003 P02 Agent A wheel-rig proof

permissions:
  contents: read

on:
  push:
    branches:
      - sol/y003-p02-wheel-rig
    paths:
      - 'yunex/src/video003/motion/**'
      - '.github/workflows/yunex-003-p02-a-wheel-proof.yml'

concurrency:
  group: y003-p02-a-wheel-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json

      - name: Verify and stage locked Porsche
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb"
          ACTUAL="$(sha256sum cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p yunex/public yunex/out/y003-agent-a-p02
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          printf '%s  %s\n' "$ACTUAL" "cars/porsche-911-gt3-rs-992/model.glb"             > yunex/out/y003-agent-a-p02/model.sha256

      - name: Install runtime
        working-directory: yunex
        run: npm ci --no-audit --no-fund

      - name: Run deterministic wheel-rig QA
        working-directory: yunex
        run: |
          set -euo pipefail
          npx esbuild src/video003/motion/qa-entry.ts             --bundle --platform=node --format=cjs             --outfile=/tmp/y003-p02-a-qa.cjs
          node /tmp/y003-p02-a-qa.cjs | tee out/y003-agent-a-p02/qa.json

      - uses: actions/upload-artifact@v4
        with:
          name: y003-p02-a-qa-${{ github.sha }}
          path: |
            yunex/out/y003-agent-a-p02/qa.json
            yunex/out/y003-agent-a-p02/model.sha256
          retention-days: 14

  proof:
    needs: qa
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: neutral
            composition: YUNEX-003-A-P02-NEUTRAL
            file: YUNEX_003_P02_A_NEUTRAL_ROLL.mp4
          - name: steering
            composition: YUNEX-003-A-P02-STEERING
            file: YUNEX_003_P02_A_STEERING_LOAD.mp4
          - name: comparison
            composition: YUNEX-003-A-P02-COMPARISON
            file: YUNEX_003_P02_A_BEFORE_AFTER.mp4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json

      - name: Stage locked Porsche
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" =             "1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb"
          mkdir -p yunex/public yunex/out/y003-agent-a-p02
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb

      - name: Install runtime
        working-directory: yunex
        run: npm ci --no-audit --no-fund

      - name: Render native proof
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          npx remotion render             src/video003/motion/proof-entry.tsx             "${{ matrix.composition }}"             "out/y003-agent-a-p02/${{ matrix.file }}"             --frames=0-89             --gl=swangle             --concurrency=2             --codec=h264             --pixel-format=yuv420p             --crf=18             --scale=1             --timeout=180000             --muted

      - uses: actions/upload-artifact@v4
        with:
          name: y003-p02-a-proof-${{ matrix.name }}-${{ github.sha }}
          path: yunex/out/y003-agent-a-p02/${{ matrix.file }}
          retention-days: 14
          if-no-files-found: error

  validate:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: y003-p02-a-*-${{ github.sha }}
          path: evidence
          merge-multiple: true

      - name: Validate and package native evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          : > evidence/ffprobe.jsonl

          for f in evidence/*.mp4; do
            ffmpeg -v error -xerror -i "$f" -f null -
            ffprobe -v error               -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,nb_frames:format=duration               -of json "$f" >> evidence/ffprobe.jsonl

            stem="$(basename "$f" .mp4)"
            for frame in 0 22 45 68 89; do
              ffmpeg -y -v error -i "$f"                 -vf "select=eq(n\\,$frame)" -frames:v 1                 "evidence/${stem}_frame-$(printf '%03d' "$frame").png"
            done
          done

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          out=Path("evidence")
          expected={
            "YUNEX_003_P02_A_NEUTRAL_ROLL.mp4": [100,189],
            "YUNEX_003_P02_A_STEERING_LOAD.mp4": [190,279],
            "YUNEX_003_P02_A_BEFORE_AFTER.mp4": [290,379],
          }
          files={p.name for p in out.glob("*.mp4")}
          if files != set(expected):
              raise SystemExit(f"proof set mismatch: {files}")

          manifest={
            "source_sha":"${{ github.sha }}",
            "model_sha256":"1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb",
            "native":True,
            "width":1080,
            "height":1920,
            "fps":30,
            "proofs":[],
          }

          for p in sorted(out.glob("*.mp4")):
              data=json.loads(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries",
                  "stream=codec_name,width,height,pix_fmt,r_frame_rate,nb_frames:format=duration",
                  "-of","json",str(p)
              ]))
              s=data["streams"][0]
              fmt=data["format"]
              if s["codec_name"]!="h264" or int(s["width"])!=1080 or int(s["height"])!=1920:
                  raise SystemExit(f"native geometry/codec mismatch: {p.name}: {s}")
              if s["r_frame_rate"]!="30/1" or int(s.get("nb_frames") or 0)!=90:
                  raise SystemExit(f"timing mismatch: {p.name}: {s}")
              if s.get("pix_fmt")!="yuv420p":
                  raise SystemExit(f"pixel format mismatch: {p.name}: {s.get('pix_fmt')}")
              manifest["proofs"].append({
                  "file":p.name,
                  "sourceFrames":expected[p.name],
                  "codec":s["codec_name"],
                  "pixelFormat":s["pix_fmt"],
                  "frameCount":int(s["nb_frames"]),
                  "durationSeconds":float(fmt["duration"]),
              })

          (out/"render-manifest.json").write_text(
              json.dumps(manifest,indent=2)+"\n"
          )
          PY

          (
            cd evidence
            sha256sum *.mp4 *.png qa.json render-manifest.json model.sha256               > proofs.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-003-P02-A-WHEEL-PROOFS-${{ github.sha }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

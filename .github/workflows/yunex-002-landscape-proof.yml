name: YUNEX 002 landscape lookdev
on:
  push:
    branches: [sol/yunex-002-landscape-fix]
    paths:
      - 'yunex/src/video002/trackUpgrade/DistantLandscape.tsx'
      - 'yunex/src/video002/trackUpgrade/TrackWorld.tsx'
      - '.github/workflows/yunex-002-landscape-proof.yml'
permissions:
  contents: read
jobs:
  lookdev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json
      - name: Stage model
        run: |
          mkdir -p yunex/public yunex/out/landscape
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          echo '1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb  yunex/public/model.glb' | sha256sum -c -
      - name: Install
        working-directory: yunex
        run: npm ci
      - name: Compile and native lookdev
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion compositions src/index.tsx > out/landscape/compositions.txt
          for frame in 24 132 240 342 456 600 720; do
            npx remotion still src/index.tsx YUNEX-002-INTEGRATED-PROOF out/landscape/frame-$frame.png --frame=$frame --gl=swangle --timeout=120000
          done
          npx remotion render src/index.tsx YUNEX-002-INTEGRATED-PROOF out/landscape/motion.mp4 --frames=18-32 --gl=swangle --concurrency=2 --scale=1 --crf=16 --timeout=120000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-002-landscape-lookdev
          path: yunex/out/landscape/
          retention-days: 7

name: YUNEX orbit-cutaway final proof

on:
  push:
    branches:
      - sol/yunex-orbit-cutaway-proof
    paths:
      - '.github/workflows/yunex-orbit-proof-review.yml'
  workflow_dispatch:

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system and fit-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check numpy scipy trimesh rtree

      - name: Stage approved assets and inspect fit
        run: |
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          cp cars/porsche-911-gt3-rs-992/engine/engine.glb yunex/public/engine.glb
          python yunex/fit_check.py

      - name: Install Remotion dependencies
        working-directory: yunex
        run: npm ci

      - name: Render 7.5s proof efficiently
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          mkdir -p out
          npx remotion render src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/proof-half.mp4 --gl=swangle --concurrency=2 --codec=h264 --crf=16 --scale=0.5
          ffmpeg -y -i out/proof-half.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4
          rm out/proof-half.mp4

      - name: Extract review frames and metadata
        working-directory: yunex
        run: |
          ffmpeg -y -ss 0.8 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_01_hero.png
          ffmpeg -y -ss 3.4 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_02_cutaway.png
          ffmpeg -y -ss 6.7 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_03_technical.png
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,codec_name,pix_fmt -of json out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 > out/ffprobe.json

      - name: Upload final proof
        uses: actions/upload-artifact@v4
        with:
          name: yunex-orbit-cutaway-final-proof
          path: |
            yunex/out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4
            yunex/out/key_01_hero.png
            yunex/out/key_02_cutaway.png
            yunex/out/key_03_technical.png
            yunex/out/fit-report.json
            yunex/out/ffprobe.json
          if-no-files-found: error
          retention-days: 7

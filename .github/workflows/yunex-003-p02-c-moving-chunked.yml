name: YUNEX 003 P02 Agent C moving proof assembly recovery

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - sol/y003-p02-track-world
    paths:
      - '.github/workflows/yunex-003-p02-c-moving-chunked.yml'

jobs:
  stitch-existing-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install proof assembly tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download successful chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: y003-p02-c-chunk-*-8f9766661482d8e591bd3976a68598873a85906f
          path: chunks
          merge-multiple: true
          repository: YunRah2103/yunus-video-lab
          run-id: 37601668282
          github-token: ${{ github.token }}

      - name: Assemble and validate 4 second moving proof
        run: |
          set -euo pipefail

          for index in 0 1 2 3; do
            test -s "chunks/chunk-${index}.mp4"
            echo "chunk-${index}:"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,nb_frames \
              -show_entries format=duration \
              -of compact=p=0:nk=1 "chunks/chunk-${index}.mp4"
          done

          ffmpeg -y \
            -i chunks/chunk-0.mp4 \
            -i chunks/chunk-1.mp4 \
            -i chunks/chunk-2.mp4 \
            -i chunks/chunk-3.mp4 \
            -filter_complex \
              "[0:v:0]setpts=PTS-STARTPTS[v0];[1:v:0]setpts=PTS-STARTPTS[v1];[2:v:0]setpts=PTS-STARTPTS[v2];[3:v:0]setpts=PTS-STARTPTS[v3];[v0][v1][v2][v3]concat=n=4:v=1:a=0[v]" \
            -map "[v]" -an -c:v libx264 -preset medium -crf 18 \
            -r 30 -pix_fmt yuv420p -movflags +faststart \
            circuit-parallax-proof-4s-chunked.mp4

          ffmpeg -v error -i circuit-parallax-proof-4s-chunked.mp4 -f null -

          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          frames="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 circuit-parallax-proof-4s-chunked.mp4)"

          echo "validated: ${width}x${height} ${fps} ${frames} frames ${pix_fmt} ${codec} duration=${duration}"

          test "$width" = "270"
          test "$height" = "480"
          test "$fps" = "30/1"
          test "$frames" = "120"
          test "$pix_fmt" = "yuv420p"
          test "$codec" = "h264"
          awk -v d="$duration" 'BEGIN { exit !(d >= 3.99 && d <= 4.01) }'

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,nb_frames \
            -show_entries format=duration,size,format_name \
            -of json circuit-parallax-proof-4s-chunked.mp4 > ffprobe.json

          sha256sum circuit-parallax-proof-4s-chunked.mp4 > sha256.txt

      - name: Upload validated moving proof
        uses: actions/upload-artifact@v4
        with:
          name: Y003-P02-C-MOVING-VALIDATED-${{ github.sha }}
          path: |
            circuit-parallax-proof-4s-chunked.mp4
            ffprobe.json
            sha256.txt
          retention-days: 14

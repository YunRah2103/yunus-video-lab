name: YUNEX 002 native render E

on:
  push:
    branches:
      - sol/yunex-002-native-final
      - sol/yunex-002-active-aero
  workflow_dispatch:
    inputs:
      mode:
        description: 'benchmark or full'
        required: true
        default: benchmark
        type: choice
        options:
          - benchmark
          - full
      source_ref:
        description: 'Manager-approved scene ref to pin and render'
        required: true
        default: sol/yunex-002-active-aero
        type: string
      approved_vo_run_id:
        description: 'Optional workflow run ID containing the approved VO artifact; leave blank for visual-only full render'
        required: false
        default: ''
        type: string
      approved_vo_artifact_name:
        description: 'Artifact name containing exactly one approved MP3'
        required: false
        default: yunex-002-approved-vo
        type: string

concurrency:
  group: yunex-002-native-render-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && contains(github.event.head_commit.message, '[native-full]')) }}

env:
  EXPECTED_EXTERIOR_SHA256: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb
  COMPOSITION: YUNEX-002-INTEGRATED-PROOF
  FPS: '30'
  TOTAL_FRAMES: '751'
  WIDTH: '1080'
  HEIGHT: '1920'
  MANAGER_REF: sol/yunex-002-active-aero

jobs:
  benchmark:
    if: (github.event_name == 'push' && github.ref_name == 'sol/yunex-002-native-final' && !contains(github.event.head_commit.message, '[skip-benchmark]') && !contains(github.event.head_commit.message, '[native-full]')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Manager-approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || env.MANAGER_REF }}
      - name: Record exact source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout E tooling at workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .native-render-tooling
          sparse-checkout: |
            yunex/src/video002/trackUpgrade/nativeRender
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json
      - name: Stage locked Porsche
        run: |
          mkdir -p yunex/public yunex/out/video002-native-benchmark
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          printf '%s  %s\n' "$EXPECTED_EXTERIOR_SHA256" cars/porsche-911-gt3-rs-992/model.glb | sha256sum -c -
      - name: Install runtime
        working-directory: yunex
        run: npm ci
      - name: Render 30 native representative frames
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          start="$(date +%s)"
          /usr/bin/time -v -o out/video002-native-benchmark/resource_usage.txt \
            npx remotion render src/index.tsx "$COMPOSITION" out/video002-native-benchmark/native-0330-0359.mp4 \
              --frames=330-359 \
              --gl=swangle \
              --concurrency=2 \
              --codec=h264 \
              --pixel-format=yuv420p \
              --crf=14 \
              --scale=1 \
              --timeout=120000
          end="$(date +%s)"
          elapsed="$((end-start))"
          printf '%s\n' "$elapsed" > out/video002-native-benchmark/elapsed_seconds.txt
      - name: Install FFmpeg for QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Probe benchmark and make temporal samples
        run: |
          ffmpeg -v error -xerror -i yunex/out/video002-native-benchmark/native-0330-0359.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,codec_name,pix_fmt,nb_read_frames \
            -show_entries format=duration \
            -of json yunex/out/video002-native-benchmark/native-0330-0359.mp4 \
            > yunex/out/video002-native-benchmark/ffprobe.json
          python .native-render-tooling/yunex/src/video002/trackUpgrade/nativeRender/validate_native.py \
            benchmark \
            yunex/out/video002-native-benchmark/ffprobe.json \
            yunex/out/video002-native-benchmark/elapsed_seconds.txt \
            yunex/out/video002-native-benchmark/resource_usage.txt \
            > yunex/out/video002-native-benchmark/benchmark.json
          mkdir -p yunex/out/video002-native-benchmark/review
          ffmpeg -y -v error -i yunex/out/video002-native-benchmark/native-0330-0359.mp4 -vf "select='eq(n,0)+eq(n,14)+eq(n,29)'" -vsync 0 yunex/out/video002-native-benchmark/review/frame-%02d.png
          sha256sum yunex/out/video002-native-benchmark/native-0330-0359.mp4 > yunex/out/video002-native-benchmark/output_sha256.txt
          sha256sum yunex/public/model.glb > yunex/out/video002-native-benchmark/porsche_sha256.txt
          cat > yunex/out/video002-native-benchmark/source_manifest.json <<EOF
          {
            "source_ref": "${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || env.MANAGER_REF }}",
            "source_sha": "${{ steps.source.outputs.sha }}",
            "tooling_sha": "${{ github.workflow_sha }}",
            "composition": "$COMPOSITION",
            "native_source": [1080, 1920],
            "scale": 1,
            "frame_range": "330-359",
            "audio": false
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-002-native-benchmark
          path: yunex/out/video002-native-benchmark/
          if-no-files-found: error
          retention-days: 7

  prepare-full:
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-full]'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      tooling_sha: ${{ steps.source.outputs.tooling_sha }}
    steps:
      - id: requested
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.source_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$MANAGER_REF" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout requested Manager source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.requested.outputs.ref }}
      - id: source
        run: |
          echo "source_ref=${{ steps.requested.outputs.ref }}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tooling_sha=${{ github.workflow_sha }}" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          CHUNK_SIZE: '30'
        run: |
          python - <<'PY'
          import json, os
          chunk=int(os.environ['CHUNK_SIZE'])
          rows=[]
          for start in range(0,751,chunk):
              end=min(750,start+chunk-1)
              rows.append({'part':f'{start:04d}-{end:04d}','frames':f'{start}-{end}'})
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps({'include':rows},separators=(',',':'))+'\n')
          PY

  render-native-chunks:
    needs: prepare-full
    if: needs.prepare-full.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare-full.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-full.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json
      - name: Stage locked Porsche
        run: |
          mkdir -p yunex/public yunex/out/video002-native-chunks
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          printf '%s  %s\n' "$EXPECTED_EXTERIOR_SHA256" cars/porsche-911-gt3-rs-992/model.glb | sha256sum -c -
      - name: Install runtime
        working-directory: yunex
        run: npm ci
      - name: Render native chunk
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx "$COMPOSITION" "out/video002-native-chunks/chunk-${{ matrix.part }}.mp4" \
            --frames="${{ matrix.frames }}" \
            --gl=swangle \
            --concurrency=2 \
            --codec=h264 \
            --pixel-format=yuv420p \
            --crf=14 \
            --scale=1 \
            --timeout=120000
          test -s "out/video002-native-chunks/chunk-${{ matrix.part }}.mp4"
          test "$(sha256sum public/model.glb | awk '{print $1}')" = "$EXPECTED_EXTERIOR_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-002-native-chunk-${{ matrix.part }}
          path: yunex/out/video002-native-chunks/chunk-${{ matrix.part }}.mp4
          if-no-files-found: error
          retention-days: 7

  stitch-native-visual:
    needs: [prepare-full, render-native-chunks]
    if: needs.render-native-chunks.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Manager source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-full.outputs.source_sha }}
      - name: Checkout E tooling at workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-full.outputs.tooling_sha }}
          path: .native-render-tooling
          sparse-checkout: |
            yunex/src/video002/trackUpgrade/nativeRender
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: yunex-002-native-chunk-*
          path: chunks
          merge-multiple: true
      - name: Install FFmpeg for stitch QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Stitch exact native frame coverage
        run: |
          python .native-render-tooling/yunex/src/video002/trackUpgrade/nativeRender/validate_chunks.py chunks > chunk_manifest.json
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('chunks').glob('chunk-*.mp4'))
          Path('list.txt').write_text(''.join(f"file '{p.resolve().as_posix()}'\\n" for p in files))
          PY
          test "$(wc -l < list.txt)" -eq 26
          ffmpeg -y -v error -f concat -safe 0 -i list.txt -c copy YUNEX_002_NATIVE_VISUAL_MASTER.mp4
          ffmpeg -v error -xerror -i YUNEX_002_NATIVE_VISUAL_MASTER.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,avg_frame_rate,codec_name,pix_fmt,nb_read_frames \
            -show_entries format=duration \
            -of json YUNEX_002_NATIVE_VISUAL_MASTER.mp4 > ffprobe.json
          python .native-render-tooling/yunex/src/video002/trackUpgrade/nativeRender/validate_native.py final-visual ffprobe.json > validation.json
          mkdir -p review
          for spec in "18 hook" "114 isolate" "210 high_downforce" "336 drs" "456 airbrake" "600 whole_car" "705 payoff"; do
            set -- $spec
            ffmpeg -y -v error -i YUNEX_002_NATIVE_VISUAL_MASTER.mp4 -vf "select=eq(n\,$1)" -frames:v 1 "review/$2.png"
          done
          sha256sum YUNEX_002_NATIVE_VISUAL_MASTER.mp4 > output_sha256.txt
          sha256sum cars/porsche-911-gt3-rs-992/model.glb > porsche_sha256.txt
          cat > native_manifest.json <<EOF
          {
            "source_ref": "${{ needs.prepare-full.outputs.source_ref }}",
            "source_sha": "${{ needs.prepare-full.outputs.source_sha }}",
            "tooling_sha": "${{ needs.prepare-full.outputs.tooling_sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "composition": "$COMPOSITION",
            "source_width": 1080,
            "source_height": 1920,
            "scale": 1,
            "fps": 30,
            "frames": 751,
            "frame_range": "0-750 inclusive exactly once",
            "chunk_size": 30,
            "codec": "h264",
            "crf": 14,
            "audio": "not muxed unless approved_vo_run_id is supplied"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-002-native-visual-master
          path: |
            YUNEX_002_NATIVE_VISUAL_MASTER.mp4
            ffprobe.json
            validation.json
            native_manifest.json
            chunk_manifest.json
            output_sha256.txt
            porsche_sha256.txt
            review/
          if-no-files-found: error
          retention-days: 7

  mux-approved-audio:
    needs: [prepare-full, stitch-native-visual]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && inputs.approved_vo_run_id != '' && needs.stitch-native-visual.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout pinned Manager source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-full.outputs.source_sha }}
      - name: Checkout E tooling at workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-full.outputs.tooling_sha }}
          path: .native-render-tooling
          sparse-checkout: |
            yunex/src/video002/trackUpgrade/nativeRender
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: yunex-002-native-visual-master
          path: visual
      - name: Download approved VO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.approved_vo_artifact_name }}
          path: approved-vo
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.approved_vo_run_id }}
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Mux and validate upload-ready master
        env:
          YUNEX002_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          mapfile -t vo_files < <(find approved-vo -type f -name '*.mp3' -print)
          test "${#vo_files[@]}" -eq 1
          test -s visual/YUNEX_002_NATIVE_VISUAL_MASTER.mp4
          mkdir -p final
          .native-render-tooling/yunex/src/video002/trackUpgrade/nativeRender/mux_validate_final.sh \
            visual/YUNEX_002_NATIVE_VISUAL_MASTER.mp4 \
            "${vo_files[0]}" \
            final/YUNEX_002_NATIVE_FINAL_AUDIO.mp4
          cat > final/final_manifest.json <<EOF
          {
            "source_ref": "${{ needs.prepare-full.outputs.source_ref }}",
            "source_sha": "${{ needs.prepare-full.outputs.source_sha }}",
            "tooling_sha": "${{ needs.prepare-full.outputs.tooling_sha }}",
            "workflow_run_id": "${{ github.run_id }}",
            "approved_vo_source_run_id": "${{ inputs.approved_vo_run_id }}",
            "approved_vo_artifact_name": "${{ inputs.approved_vo_artifact_name }}",
            "source_width": 1080,
            "source_height": 1920,
            "scale": 1,
            "fps": 30,
            "frames": 751,
            "audio": true
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-002-native-final-audio
          path: final/
          if-no-files-found: error
          retention-days: 7

name: YUNEX 002 chunked full proof

on:
  push:
    branches:
      - sol/yunex-002-active-aero
    paths:
      - '.github/workflows/yunex-002-chunked-full-proof.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - part: a
            frames: 0-83
          - part: b
            frames: 84-167
          - part: c
            frames: 168-251
          - part: d
            frames: 252-335
          - part: e
            frames: 336-419
          - part: f
            frames: 420-503
          - part: g
            frames: 504-587
          - part: h
            frames: 588-671
          - part: i
            frames: 672-750
    env:
      EXPECTED_EXTERIOR_SHA256: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json
      - name: Stage locked Porsche
        run: |
          mkdir -p yunex/public yunex/out/chunks
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          printf '%s  %s\n' "$EXPECTED_EXTERIOR_SHA256" cars/porsche-911-gt3-rs-992/model.glb | sha256sum -c -
      - name: Install runtime
        working-directory: yunex
        run: npm ci
      - name: Render chunk
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-002-INTEGRATED-PROOF "out/chunks/part-${{ matrix.part }}.mp4" --frames="${{ matrix.frames }}" --gl=swangle --concurrency=2 --codec=h264 --crf=18 --scale=0.5 --timeout=120000
          ffmpeg -v error -xerror -i "out/chunks/part-${{ matrix.part }}.mp4" -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-002-chunk-${{ matrix.part }}
          path: yunex/out/chunks/part-${{ matrix.part }}.mp4
          if-no-files-found: error
          retention-days: 7

  stitch:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: yunex-002-chunk-*
          path: chunks
          merge-multiple: true
      - name: Stitch and validate
        run: |
          printf "file 'part-a.mp4'\nfile 'part-b.mp4'\nfile 'part-c.mp4'\nfile 'part-d.mp4'\nfile 'part-e.mp4'\nfile 'part-f.mp4'\nfile 'part-g.mp4'\nfile 'part-h.mp4'\nfile 'part-i.mp4'\n" > chunks/list.txt
          ffmpeg -y -v error -f concat -safe 0 -i chunks/list.txt -c copy YUNEX_002_INTEGRATED_PROXY_540x960.mp4\n          ffmpeg -y -v error -i YUNEX_002_INTEGRATED_PROXY_540x960.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p YUNEX_002_INTEGRATED_PROOF.mp4
          ffmpeg -v error -xerror -i YUNEX_002_INTEGRATED_PROOF.mp4 -f null -
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt,nb_read_frames -show_entries format=duration -of json YUNEX_002_INTEGRATED_PROOF.mp4 > ffprobe.json
          python - <<'PY'
          import json
          s=json.load(open('ffprobe.json'))
          stream=s['streams'][0]
          assert (stream['width'],stream['height'])==(1080,1920),stream
          assert stream['r_frame_rate']=='30/1',stream
          assert int(stream['nb_read_frames'])==751,stream
          duration=float(s['format']['duration'])
          assert 24.9 <= duration <= 25.2,duration
          PY
          mkdir review
          for spec in "0.6 hook" "3.8 isolate" "7.0 high_downforce" "11.2 drs" "15.2 airbrake" "20.0 whole_car" "23.5 payoff"; do
            set -- $spec
            ffmpeg -y -v error -ss "$1" -i YUNEX_002_INTEGRATED_PROOF.mp4 -frames:v 1 "review/$2.png"
          done
          sha256sum YUNEX_002_INTEGRATED_PROOF.mp4 > proof_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-002-integrated-full-proof
          path: |
            YUNEX_002_INTEGRATED_PROOF.mp4
            ffprobe.json
            proof_sha256.txt
            review/
          if-no-files-found: error
          retention-days: 7

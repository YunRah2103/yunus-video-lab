name: YUNEX 003 native render and delivery

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - sol/y003-render
    paths:
      - '.github/workflows/yunex-003-render.yml'
      - 'yunex/video003/render/**'
      - 'yunex/video003/reports/G/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'selftest, benchmark or full'
        required: true
        default: selftest
        type: choice
        options:
          - selftest
          - benchmark
          - full
      render_source_sha:
        description: 'Manager-approved full 40-char source SHA (required for benchmark/full)'
        required: false
        default: ''
        type: string
      total_frames:
        description: 'Exact composition frame count'
        required: true
        default: '751'
        type: string
      chunk_size:
        description: 'Native render chunk size'
        required: true
        default: '20'
        type: string
      milestone_frames:
        description: 'Comma-separated seven milestone frames, or auto'
        required: true
        default: 'auto'
        type: string

concurrency:
  group: yunex-003-native-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  EXPECTED_EXTERIOR_SHA256: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb
  WIDTH: '1080'
  HEIGHT: '1920'
  FPS: '30'

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      source_sha: ${{ steps.cfg.outputs.source_sha }}
      composition: ${{ steps.cfg.outputs.composition }}
      total_frames: ${{ steps.cfg.outputs.total_frames }}
      chunk_size: ${{ steps.cfg.outputs.chunk_size }}
      milestone_frames: ${{ steps.cfg.outputs.milestone_frames }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - id: cfg
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          request=json.loads(Path("pipeline/yunex/video003/render/request.json").read_text())
          event=os.environ["EVENT"]
          message=os.environ.get("COMMIT_MESSAGE","")
          if event == "workflow_dispatch":
              mode=os.environ["INPUT_MODE"]
              source=(os.environ.get("INPUT_SOURCE") or request.get("render_source_sha") or "").strip()
              total=int(os.environ["INPUT_TOTAL"])
              chunk=int(os.environ["INPUT_CHUNK"])
              milestones=os.environ["INPUT_MILESTONES"].strip()
          else:
              mode="full" if "[native-full]" in message else ("benchmark" if "[native-benchmark]" in message else "selftest")
              source=(request.get("render_source_sha") or "").strip()
              total=int(request.get("total_frames",751))
              chunk=int(request.get("chunk_size",20))
              milestones=str(request.get("milestone_frames","auto")).strip()

          composition=str(request.get("composition","YUNEX-003-FINAL"))
          if composition != "YUNEX-003-FINAL":
              raise SystemExit("request composition must be YUNEX-003-FINAL")
          if total < 1 or chunk < 1:
              raise SystemExit("total_frames and chunk_size must be positive")
          if mode in {"benchmark","full"} and not re.fullmatch(r"[0-9a-fA-F]{40}", source):
              raise SystemExit("benchmark/full requires exact 40-character render_source_sha")
          if mode == "full" and milestones != "auto":
              vals=[int(x) for x in milestones.split(",") if x.strip()]
              if len(vals) != 7 or len(set(vals)) != 7 or min(vals) < 0 or max(vals) >= total:
                  raise SystemExit("milestone_frames must contain seven unique in-range frames")

          out=Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"mode={mode}\n")
              f.write(f"source_sha={source}\n")
              f.write(f"composition={composition}\n")
              f.write(f"total_frames={total}\n")
              f.write(f"chunk_size={chunk}\n")
              f.write(f"milestone_frames={milestones}\n")
          PY
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE: ${{ inputs.render_source_sha }}
          INPUT_TOTAL: ${{ inputs.total_frames }}
          INPUT_CHUNK: ${{ inputs.chunk_size }}
          INPUT_MILESTONES: ${{ inputs.milestone_frames }}

  selftest:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - name: Python syntax and deterministic matrix tests
        run: |
          set -euo pipefail
          python -m py_compile pipeline/yunex/video003/render/*.py
          matrix="$(python pipeline/yunex/video003/render/make_chunk_matrix.py 41 20)"
          python - "$matrix" <<'PY'
          import json, sys
          d=json.loads(sys.argv[1])
          rows=d["include"]
          assert [(x["start"],x["end"],x["count"]) for x in rows] == [(0,19,20),(20,39,20),(40,40,1)]
          print("matrix self-test PASS")
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path("pipeline/yunex/video003/render/request.json").read_text())
          assert request["composition"] == "YUNEX-003-FINAL"
          assert request["phase"] == "Y003-SUSPENSION-AERO-01"
          print("request guard self-test PASS")
          PY

  benchmark:
    needs: [config, selftest]
    if: needs.config.outputs.mode == 'benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/yunex/package-lock.json
      - name: Verify exact source and stage locked Porsche
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          test "$actual" = "${{ needs.config.outputs.source_sha }}"
          test "$(sha256sum source/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$EXPECTED_EXTERIOR_SHA256"
          mkdir -p source/yunex/public source/yunex/out/y003-benchmark
          cp source/cars/porsche-911-gt3-rs-992/model.glb source/yunex/public/model.glb
      - name: Install runtime
        working-directory: source/yunex
        run: npm ci --no-audit --no-fund
      - name: Native 30-frame benchmark
        working-directory: source/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          start="$(date +%s)"
          /usr/bin/time -v -o out/y003-benchmark/resource_usage.txt             npx remotion render src/index.tsx "${{ needs.config.outputs.composition }}" out/y003-benchmark/native-0000-0029.mp4               --frames=0-29 --gl=swangle --concurrency=2 --codec=h264 --pixel-format=yuv420p               --crf=14 --scale=1 --timeout=120000 --muted
          echo "$(( $(date +%s) - start ))" > out/y003-benchmark/elapsed_seconds.txt
          printf '%s\n' "${{ needs.config.outputs.source_sha }}" > out/y003-benchmark/source-sha.txt
          sha256sum out/y003-benchmark/native-0000-0029.mp4 > out/y003-benchmark/output-sha256.txt
      - name: Decode/probe benchmark
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -xerror -i source/yunex/out/y003-benchmark/native-0000-0029.mp4 -f null -
          ffprobe -v error -count_frames -show_streams -of json source/yunex/out/y003-benchmark/native-0000-0029.mp4 > source/yunex/out/y003-benchmark/ffprobe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: y003-native-benchmark-${{ needs.config.outputs.source_sha }}
          path: source/yunex/out/y003-benchmark/
          retention-days: 14
          if-no-files-found: error

  matrix:
    needs: [config, selftest]
    if: needs.config.outputs.mode == 'full'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - id: make
        run: |
          python pipeline/yunex/video003/render/make_chunk_matrix.py             "${{ needs.config.outputs.total_frames }}"             "${{ needs.config.outputs.chunk_size }}"             --github-output "$GITHUB_OUTPUT"

  render-native-chunks:
    needs: [config, matrix]
    if: needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/yunex/package-lock.json
      - name: Verify source and locked model
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          test "$(sha256sum source/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$EXPECTED_EXTERIOR_SHA256"
          mkdir -p source/yunex/public source/yunex/out/y003-chunk
          cp source/cars/porsche-911-gt3-rs-992/model.glb source/yunex/public/model.glb
      - name: Install runtime
        working-directory: source/yunex
        run: npm ci --no-audit --no-fund
      - name: Render native visual chunk
        working-directory: source/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          part="${{ matrix.part }}"
          npx remotion render src/index.tsx "${{ needs.config.outputs.composition }}" "out/y003-chunk/chunk-$part.mp4"             --frames="${{ matrix.frames }}" --gl=swangle --concurrency=2 --codec=h264             --pixel-format=yuv420p --crf=14 --scale=1 --timeout=120000 --muted
          printf '%s\n' "${{ needs.config.outputs.source_sha }}" > "out/y003-chunk/source-sha-$part.txt"
          printf '{"frames":"%s","part":"%s","source_sha":"%s","composition":"%s","width":1080,"height":1920,"scale":1,"fps":30}\n'             "${{ matrix.frames }}" "$part" "${{ needs.config.outputs.source_sha }}" "${{ needs.config.outputs.composition }}"             > "out/y003-chunk/config-$part.json"
          sha256sum "out/y003-chunk/chunk-$part.mp4" > "out/y003-chunk/chunk-$part.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: y003-native-chunk-${{ matrix.part }}
          path: source/yunex/out/y003-chunk/
          retention-days: 14
          if-no-files-found: error

  render-audio:
    needs: [config, matrix]
    if: needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/yunex/package-lock.json
      - name: Verify source and stage model
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          test "$(sha256sum source/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$EXPECTED_EXTERIOR_SHA256"
          mkdir -p source/yunex/public source/yunex/out/y003-audio
          cp source/cars/porsche-911-gt3-rs-992/model.glb source/yunex/public/model.glb
      - name: Install runtime
        working-directory: source/yunex
        run: npm ci --no-audit --no-fund
      - name: Render composition audio once
        working-directory: source/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          npx remotion render src/index.tsx "${{ needs.config.outputs.composition }}" out/y003-audio/YUNEX_003_AUDIO.m4a             --codec=aac --timeout=120000
          test -s out/y003-audio/YUNEX_003_AUDIO.m4a
          printf '%s\n' "${{ needs.config.outputs.source_sha }}" > out/y003-audio/source-sha.txt
          sha256sum out/y003-audio/YUNEX_003_AUDIO.m4a > out/y003-audio/audio.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: y003-native-audio
          path: source/yunex/out/y003-audio/
          retention-days: 14
          if-no-files-found: error

  assemble-validate:
    needs: [config, matrix, render-native-chunks, render-audio]
    if: needs.render-native-chunks.result == 'success' && needs.render-audio.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: pipeline
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.config.outputs.source_sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: y003-native-chunk-*
          path: chunks
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: y003-native-audio
          path: audio
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate source, chunks and assemble native visual
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${{ needs.config.outputs.source_sha }}"
          python pipeline/yunex/video003/render/validate_chunks.py chunks             --total-frames "${{ needs.config.outputs.total_frames }}"             --expected-source "${{ needs.config.outputs.source_sha }}"             > chunk-manifest.json
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path("chunks").glob("chunk-*.mp4"))
          if not files:
              raise SystemExit("no chunk mp4 files")
          Path("concat.txt").write_text("".join(f"file '{p.resolve()}'\n" for p in files))
          PY
          ffmpeg -y -v error -f concat -safe 0 -i concat.txt -c copy YUNEX_003_NATIVE_VISUAL.mp4
          python pipeline/yunex/video003/render/validate_export.py YUNEX_003_NATIVE_VISUAL.mp4             --total-frames "${{ needs.config.outputs.total_frames }}"             > visual-validation.json
      - name: Mux approved composition audio once and fully validate
        run: |
          set -euo pipefail
          test "$(cat audio/source-sha.txt)" = "${{ needs.config.outputs.source_sha }}"
          ffmpeg -y -v error             -i YUNEX_003_NATIVE_VISUAL.mp4             -i audio/YUNEX_003_AUDIO.m4a             -map 0:v:0 -map 1:a:0             -c:v copy -c:a copy -movflags +faststart             YUNEX_003_FINAL.mp4
          python pipeline/yunex/video003/render/validate_export.py YUNEX_003_FINAL.mp4             --total-frames "${{ needs.config.outputs.total_frames }}"             --require-audio             > final-validation.json
          sha256sum YUNEX_003_FINAL.mp4 > final.sha256
          sha256sum source/cars/porsche-911-gt3-rs-992/model.glb > porsche.sha256
      - name: Extract seven native milestones and contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          total=int(os.environ["TOTAL"])
          raw=os.environ["RAW"]
          if raw == "auto":
              ps=[0.04,0.20,0.36,0.52,0.68,0.84,0.96]
              frames=[round((total-1)*p) for p in ps]
          else:
              frames=[int(x) for x in raw.split(",")]
          if len(frames) != 7 or len(set(frames)) != 7:
              raise SystemExit("need exactly seven unique milestones")
          open("milestones.txt","w").write("\n".join(map(str,frames))+"\n")
          PY
          mkdir -p review
          i=1
          while read -r frame; do
            ffmpeg -y -v error -i YUNEX_003_FINAL.mp4               -vf "select=eq(n\,$frame)" -vsync 0 -frames:v 1               "review/milestone-$(printf '%02d' "$i")-frame-$frame.png"
            i=$((i+1))
          done < milestones.txt
          ffmpeg -y -v error -framerate 1 -pattern_type glob -i 'review/milestone-*.png'             -vf "scale=270:480,tile=4x2:padding=6:margin=6" -frames:v 1 review/contact-sheet.png
        env:
          TOTAL: ${{ needs.config.outputs.total_frames }}
          RAW: ${{ needs.config.outputs.milestone_frames }}
      - name: Write immutable export manifest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""): h.update(b)
              return h.hexdigest()
          manifest={
              "phase":"Y003-SUSPENSION-AERO-01",
              "status":"NATIVE_EXPORT_VALIDATED",
              "render_source_sha":os.environ["SOURCE"],
              "pipeline_sha":os.environ["PIPELINE"],
              "workflow_run_id":os.environ["RUN_ID"],
              "composition":"YUNEX-003-FINAL",
              "width":1080,
              "height":1920,
              "scale":1,
              "fps":30,
              "frames":int(os.environ["TOTAL"]),
              "frame_range":f"0-{int(os.environ['TOTAL'])-1}",
              "video_codec":"h264",
              "pixel_format":"yuv420p",
              "audio_codec":"aac",
              "faststart":True,
              "porsche_sha256":"1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb",
              "final_sha256":sha("YUNEX_003_FINAL.mp4"),
              "audio_sha256":sha("audio/YUNEX_003_AUDIO.m4a"),
              "milestone_frames":[int(x) for x in pathlib.Path("milestones.txt").read_text().split()],
          }
          pathlib.Path("export-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
        env:
          SOURCE: ${{ needs.config.outputs.source_sha }}
          PIPELINE: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TOTAL: ${{ needs.config.outputs.total_frames }}
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-003-NATIVE-FINAL-${{ needs.config.outputs.source_sha }}
          path: |
            YUNEX_003_FINAL.mp4
            YUNEX_003_NATIVE_VISUAL.mp4
            chunk-manifest.json
            visual-validation.json
            final-validation.json
            export-manifest.json
            final.sha256
            porsche.sha256
            milestones.txt
            review/
          retention-days: 14
          if-no-files-found: error

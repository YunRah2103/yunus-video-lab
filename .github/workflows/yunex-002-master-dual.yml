name: YUNEX 002 master dual native finish
on:
  push:
    branches: [sol/y002-master-dual-finish]
    paths: ['.github/workflows/yunex-002-master-dual.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - part: '00'
            frames: '0-19'
          - part: '01'
            frames: '20-39'
          - part: '02'
            frames: '40-59'
          - part: '03'
            frames: '60-79'
          - part: '04'
            frames: '80-99'
          - part: '05'
            frames: '100-119'
          - part: '06'
            frames: '120-139'
          - part: '07'
            frames: '140-159'
          - part: '08'
            frames: '160-179'
          - part: '09'
            frames: '180-199'
          - part: '10'
            frames: '200-219'
          - part: '11'
            frames: '220-239'
          - part: '12'
            frames: '240-259'
          - part: '13'
            frames: '260-279'
          - part: '14'
            frames: '280-299'
          - part: '15'
            frames: '300-319'
          - part: '16'
            frames: '320-339'
          - part: '17'
            frames: '340-359'
          - part: '18'
            frames: '360-379'
          - part: '19'
            frames: '380-399'
          - part: '20'
            frames: '400-419'
          - part: '21'
            frames: '420-439'
          - part: '22'
            frames: '440-459'
          - part: '23'
            frames: '460-479'
          - part: '24'
            frames: '480-499'
          - part: '25'
            frames: '500-519'
          - part: '26'
            frames: '520-539'
          - part: '27'
            frames: '540-559'
          - part: '28'
            frames: '560-579'
          - part: '29'
            frames: '580-599'
          - part: '30'
            frames: '600-619'
          - part: '31'
            frames: '620-639'
          - part: '32'
            frames: '640-659'
          - part: '33'
            frames: '660-679'
          - part: '34'
            frames: '680-699'
          - part: '35'
            frames: '700-719'
          - part: '36'
            frames: '720-739'
          - part: '37'
            frames: '740-750'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f4569a926d61bb7475b0949ae11b59c3765220
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json
      - name: Verify and stage approved model
        run: |
          set -euo pipefail
          test "$(sha256sum cars/porsche-911-gt3-rs-992/model.glb | cut -d' ' -f1)" = "1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb"
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
      - name: Native fresh visual chunk
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          env -u NODE_OPTIONS npm ci --no-audit --no-fund
          npx remotion render src/index.tsx YUNEX-002-INTEGRATED-PROOF out/chunk-${{ matrix.part }}.mp4 --frames=${{ matrix.frames }} --gl=swangle --concurrency=2 --codec=h264 --crf=14 --scale=1 --timeout=120000 --muted
          printf '%s\n' 'c3f4569a926d61bb7475b0949ae11b59c3765220' > out/source-sha.txt
          ffprobe -v error -count_frames -show_streams -of json out/chunk-${{ matrix.part }}.mp4 > out/probe-${{ matrix.part }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: y002-master-native-${{ matrix.part }}
          path: |
            yunex/out/chunk-${{ matrix.part }}.mp4
            yunex/out/probe-${{ matrix.part }}.json
            yunex/out/source-sha.txt
          retention-days: 14
          if-no-files-found: error

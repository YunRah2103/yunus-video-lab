name: YUNEX 003 P02-B native proof gate

permissions:
  contents: write

on:
  push:
    branches:
      - sol/y003-p02-suspension-detail
    paths:
      - '.github/workflows/y003-p02-b-proof.yml'

concurrency:
  group: y003-p02-b-proof
  cancel-in-progress: false

env:
  SOURCE_SHA: d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d
  BASE_SHA: 064fc7687ad16e9fc99c32c3c323154b7e4496f1
  MODEL_SHA: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb

jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: sol/y003-p02-suspension-detail
          path: proof-branch
          fetch-depth: 0

      - name: Checkout exact B implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: after
          persist-credentials: false

      - name: Checkout exact phase base
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: before
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: after/yunex/package-lock.json

      - name: Verify pinned sources and stage locked Porsche
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C after rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C before rev-parse HEAD)" = "$BASE_SHA"
          test "$(sha256sum after/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$MODEL_SHA"
          test "$(sha256sum before/cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "$MODEL_SHA"
          mkdir -p after/yunex/public before/yunex/public after/yunex/out/p02-b before/yunex/out/p02-b
          cp after/cars/porsche-911-gt3-rs-992/model.glb after/yunex/public/model.glb
          cp before/cars/porsche-911-gt3-rs-992/model.glb before/yunex/public/model.glb

      - name: Install exact source runtime
        working-directory: after/yunex
        run: npm ci --no-audit --no-fund

      - name: Install exact baseline runtime
        working-directory: before/yunex
        run: npm ci --no-audit --no-fund

      - name: Render native baseline installed macro
        working-directory: before/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b/installed-before-f234.png             --frame=234 --gl=swangle --scale=1 --timeout=180000

      - name: Render native current installed macros
        working-directory: after/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b/installed-after-f234.png             --frame=234 --gl=swangle --scale=1 --timeout=180000
          npx remotion still src/index.tsx YUNEX-003-VISUAL out/p02-b/mechanical-load-f492.png             --frame=492 --gl=swangle --scale=1 --timeout=180000

      - name: Render native installed articulation proof
        working-directory: after/yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-003-VISUAL out/p02-b/articulation-native-f441-568.mp4             --frames=441-568 --gl=swangle --concurrency=2 --codec=h264             --pixel-format=yuv420p --crf=16 --scale=1 --timeout=180000 --muted

      - name: Verify native evidence
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -v error -xerror -i after/yunex/out/p02-b/articulation-native-f441-568.mp4 -f null -
          ffprobe -v error -count_frames             -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,nb_read_frames             -show_entries format=duration             -of json after/yunex/out/p02-b/articulation-native-f441-568.mp4             > after/yunex/out/p02-b/articulation-probe.json
          ffprobe -v error -show_entries stream=codec_name,width,height -of json             before/yunex/out/p02-b/installed-before-f234.png > before/yunex/out/p02-b/before-probe.json
          ffprobe -v error -show_entries stream=codec_name,width,height -of json             after/yunex/out/p02-b/installed-after-f234.png > after/yunex/out/p02-b/after-probe.json
          ffprobe -v error -show_entries stream=codec_name,width,height -of json             after/yunex/out/p02-b/mechanical-load-f492.png > after/yunex/out/p02-b/load-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          video=json.loads(Path('after/yunex/out/p02-b/articulation-probe.json').read_text())
          s=video['streams'][0]
          assert s['codec_name']=='h264', s
          assert s['pix_fmt']=='yuv420p', s
          assert int(s['width'])==1080 and int(s['height'])==1920, s
          assert s['r_frame_rate']=='30/1', s
          assert int(s['nb_read_frames'])==128, s
          duration=float(video['format']['duration'])
          assert 4.20 <= duration <= 4.34, duration
          for p in [
              'before/yunex/out/p02-b/before-probe.json',
              'after/yunex/out/p02-b/after-probe.json',
              'after/yunex/out/p02-b/load-probe.json',
          ]:
              d=json.loads(Path(p).read_text())['streams'][0]
              assert d['codec_name']=='png', d
              assert int(d['width'])==1080 and int(d['height'])==1920, d
          PY
          ffmpeg -y -v error             -i before/yunex/out/p02-b/installed-before-f234.png             -i after/yunex/out/p02-b/installed-after-f234.png             -filter_complex "[0:v][1:v]blend=all_mode=difference"             -frames:v 1 after/yunex/out/p02-b/installed-difference-f234.png
          sha256sum             before/yunex/out/p02-b/installed-before-f234.png             after/yunex/out/p02-b/installed-after-f234.png             after/yunex/out/p02-b/mechanical-load-f492.png             after/yunex/out/p02-b/articulation-native-f441-568.mp4             > after/yunex/out/p02-b/SHA256SUMS.txt

      - name: Write proof manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path

          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1<<20),b''):
                      h.update(chunk)
              return h.hexdigest()

          probe=json.loads(Path('after/yunex/out/p02-b/articulation-probe.json').read_text())
          manifest={
              'phase':'Y003-POLISH-02',
              'role':'B',
              'status':'NATIVE_PROOF_COMPLETE',
              'implementation_sha':'d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d',
              'phase_base_sha':'064fc7687ad16e9fc99c32c3c323154b7e4496f1',
              'model_sha256':'1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb',
              'installed_before':{'frame':234,'width':1080,'height':1920,'sha256':sha('before/yunex/out/p02-b/installed-before-f234.png')},
              'installed_after':{'frame':234,'width':1080,'height':1920,'sha256':sha('after/yunex/out/p02-b/installed-after-f234.png')},
              'mechanical_load_still':{'frame':492,'width':1080,'height':1920,'sha256':sha('after/yunex/out/p02-b/mechanical-load-f492.png')},
              'articulation':{
                  'frames':'441-568',
                  'decoded_frames':128,
                  'fps':30,
                  'width':1080,
                  'height':1920,
                  'codec':'h264',
                  'pixel_format':'yuv420p',
                  'duration_seconds':float(probe['format']['duration']),
                  'sha256':sha('after/yunex/out/p02-b/articulation-native-f441-568.mp4'),
              },
              'decoder_pass':True,
              'notes':'Native installed proof uses the exact current B implementation SHA. Articulation covers the mechanical-load shot while suspension visibility remains active.'
          }
          Path('after/yunex/out/p02-b/PROOF_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          cat > after/yunex/out/p02-b/PROOF_RESULTS.md <<'EOF'
          # YUNEX 003 — POLISH 02 — B native proof result

          PASS for the Agent B proof gate.

          Exact implementation rendered: d4b81aacfeeedfb2475c4e4cc59ed8a352164f4d
          Exact phase base used for before comparison: 064fc7687ad16e9fc99c32c3c323154b7e4496f1
          Approved Porsche model hash remained unchanged.

          Native installed comparison:
          - before: frame 234 from the phase base
          - after: frame 234 from the current B implementation
          - both: 1080x1920 PNG
          - difference image generated from the two native frames

          Native load still:
          - frame 492
          - 1080x1920 PNG
          - current B implementation

          Native installed articulation:
          - frames 441-568
          - 128 decoded frames
          - 30 fps
          - 1080x1920
          - H.264 yuv420p
          - full ffmpeg decoder pass

          This proof does not modify motion, track, timeline, Video003.tsx, registry, narration or the approved GLB.
          EOF

      - name: Commit proof evidence to B branch
        shell: bash
        run: |
          set -euo pipefail
          dest=proof-branch/yunex/video003/reports/P02-B/proof
          mkdir -p "$dest"
          cp before/yunex/out/p02-b/installed-before-f234.png "$dest/"
          cp after/yunex/out/p02-b/installed-after-f234.png "$dest/"
          cp after/yunex/out/p02-b/installed-difference-f234.png "$dest/"
          cp after/yunex/out/p02-b/mechanical-load-f492.png "$dest/"
          cp after/yunex/out/p02-b/articulation-native-f441-568.mp4 "$dest/"
          cp after/yunex/out/p02-b/articulation-probe.json "$dest/"
          cp after/yunex/out/p02-b/after-probe.json "$dest/"
          cp before/yunex/out/p02-b/before-probe.json "$dest/"
          cp after/yunex/out/p02-b/load-probe.json "$dest/"
          cp after/yunex/out/p02-b/SHA256SUMS.txt "$dest/"
          cp after/yunex/out/p02-b/PROOF_MANIFEST.json "$dest/"
          cp after/yunex/out/p02-b/PROOF_RESULTS.md "$dest/"

          cd proof-branch
          git config user.name "YUNEX Proof Bot"
          git config user.email "actions@github.com"
          git add yunex/video003/reports/P02-B/proof
          git commit -m "YUNEX 003 P02-B: add native installed articulation proof"
          git push origin HEAD:sol/y003-p02-suspension-detail

name: YUNEX track motion publish inspected proof

on:
  push:
    branches:
      - sol/yunex-track-motion-final
    paths:
      - '.github/workflows/yunex-track-motion-publish.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated inspection bundle
        uses: actions/download-artifact@v4
        with:
          name: yunex-track-motion-final-inspection
          path: /tmp/motion-proof
          repository: YunRah2103/yunus-video-lab
          run-id: 37330180125
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install proof bundle and revalidate
        env:
          EXPECTED_EXTERIOR_SHA256: 1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb
          EXPECTED_ENGINE_SHA256: aa05a760bcc778483c7684653f7200399d3eb540a36b1e7b0e4ec9248bc0841d
        run: |
          mkdir -p yunex/track-refinement
          cp /tmp/motion-proof/portrait_motion_proof.mp4 yunex/track-refinement/
          cp /tmp/motion-proof/motion_ffprobe.json yunex/track-refinement/
          cp /tmp/motion-proof/motion_frame_000.png yunex/track-refinement/
          cp /tmp/motion-proof/motion_frame_mid.png yunex/track-refinement/
          cp /tmp/motion-proof/motion_frame_end.png yunex/track-refinement/

          ffmpeg -v error -i yunex/track-refinement/portrait_motion_proof.mp4 -f null -
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("yunex/track-refinement/motion_ffprobe.json").read_text())["streams"][0]
          assert (s["width"], s["height"]) == (1080, 1920), s
          assert s["r_frame_rate"] == "30/1", s
          assert int(s["nb_read_frames"]) == 75, s
          assert s["codec_name"] == "h264", s
          PY
          printf '%s  %s\n' "$EXPECTED_EXTERIOR_SHA256" cars/porsche-911-gt3-rs-992/model.glb | sha256sum -c -
          printf '%s  %s\n' "$EXPECTED_ENGINE_SHA256" cars/porsche-911-gt3-rs-992/engine/engine.glb | sha256sum -c -

      - name: Write final inspected motion QA
        run: |
          cat > yunex/track-refinement/MOTION_QA.md <<'EOF'
          # YUNEX track motion proof QA

          Render source commit: `c8c9d8a79f018478d896e84e190dae844bcd0708`
          Render workflow run: `37330180125`
          Composition: `YUNEX-TRACK-MOTION-PROOF`

          ## Render
          Native frame-driven Remotion proof rendered as three native frame ranges and concatenated without re-encoding:
          - frames 0-24
          - frames 25-49
          - frames 50-74
          - each range used `--gl=swangle --concurrency=2 --codec=h264 --crf=17 --timeout=120000`
          - final dimensions: 1080 x 1920
          - final frame rate: 30/1
          - final frame count: 75
          - final codec: H.264
          - full FFmpeg decode: PASS

          ## Locked assets
          - Exterior SHA-256: `1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb`
          - Engine SHA-256: `aa05a760bcc778483c7684653f7200399d3eb540a36b1e7b0e4ec9248bc0841d`
          - Both hashes were verified during each segment render and again before publication.

          ## Visual inspection
          The actual assembled MP4 was decoded and inspected through its exact opening, midpoint and ending frames plus an evenly sampled 15-frame contact sheet derived from the MP4.

          PASS:
          - no foliage popping or temporal discontinuity observed
          - no transparency instability observed
          - no car/rail intersection
          - no floating tyres; contact remains visually planted
          - Porsche remains fully framed across the orbit
          - green livery remains separated from subdued foliage
          - contact shadow remains present
          - foliage spacing/silhouettes remain varied enough to avoid a repeated wall
          - perspective remains coherent
          - camera move is subtle and premium rather than a sweeping game-camera move

          ## Corrective pass
          No corrective source pass was required after inspection. The proof met the motion acceptance checks as rendered.

          ## Remaining limitation
          The foliage is intentionally economical procedural low-poly geometry for render efficiency; this proof validates motion stability and composition rather than photoreal vegetation detail.
          EOF

      - name: Commit and push finished Agent B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f yunex/track-refinement/portrait_motion_proof.mp4
          git add yunex/track-refinement/motion_ffprobe.json
          git add yunex/track-refinement/motion_frame_000.png
          git add yunex/track-refinement/motion_frame_mid.png
          git add yunex/track-refinement/motion_frame_end.png
          git add yunex/track-refinement/MOTION_QA.md
          git diff --cached --quiet || git commit -m "YUNEX track motion: publish inspected native proof [skip ci]"
          git pull --rebase origin sol/yunex-track-motion-final
          git push origin HEAD:sol/yunex-track-motion-final

name: YUNEX 003 P02 Agent C final exit motion assembly

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - sol/y003-p02-track-world
    paths:
      - '.github/workflows/yunex-003-p02-c-exit-final-assembly.yml'

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install assembly tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download fresh final-exit chunks
        uses: actions/download-artifact@v4
        with:
          pattern: y003-p02-c-exit-chunk-*-a27fbd0d19a1b7d74dc3a7890832906ed182c34e
          path: chunks
          merge-multiple: true
          repository: YunRah2103/yunus-video-lab
          run-id: 37615339642
          github-token: ${{ github.token }}

      - name: Assemble and validate final-exit proof
        run: |
          set -euo pipefail

          test -s chunks/chunk-2.mp4
          test -s chunks/chunk-3.mp4
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 chunks/chunk-2.mp4)" = "30"
          test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 chunks/chunk-3.mp4)" = "30"

          ffmpeg -y \
            -i chunks/chunk-2.mp4 \
            -i chunks/chunk-3.mp4 \
            -filter_complex "[0:v:0]setpts=PTS-STARTPTS[v0];[1:v:0]setpts=PTS-STARTPTS[v1];[v0][v1]concat=n=2:v=1:a=0[v]" \
            -map "[v]" -an -c:v libx264 -preset medium -crf 18 -r 30 -pix_fmt yuv420p -movflags +faststart \
            exit-frame711-motion-proof-2s.mp4

          ffmpeg -v error -i exit-frame711-motion-proof-2s.mp4 -f null -

          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          frames="$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 exit-frame711-motion-proof-2s.mp4)"

          test "$width" = "270"
          test "$height" = "480"
          test "$fps" = "30/1"
          test "$frames" = "60"
          test "$pix_fmt" = "yuv420p"
          test "$codec" = "h264"
          awk -v d="$duration" 'BEGIN { exit !(d >= 1.99 && d <= 2.01) }'

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,nb_frames \
            -show_entries format=duration,size,format_name \
            -of json exit-frame711-motion-proof-2s.mp4 > ffprobe.json
          sha256sum exit-frame711-motion-proof-2s.mp4 > sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Y003-P02-C-EXIT-FRAME711-MOTION-VALIDATED-${{ github.sha }}
          path: |
            exit-frame711-motion-proof-2s.mp4
            ffprobe.json
            sha256.txt
          retention-days: 14

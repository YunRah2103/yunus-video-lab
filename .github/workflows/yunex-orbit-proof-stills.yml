name: YUNEX orbit-cutaway rescue stills

on:
  push:
    branches:
      - sol/yunex-orbit-cutaway-proof
    paths:
      - 'yunex/src/OrbitCutawayProof.tsx'
      - 'yunex/src/index.tsx'
      - '.github/workflows/yunex-orbit-proof-stills.yml'
  workflow_dispatch:

jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json

      - name: Stage approved assets
        run: |
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          cp cars/porsche-911-gt3-rs-992/engine/engine.glb yunex/public/engine.glb

      - name: Install dependencies
        working-directory: yunex
        run: npm ci

      - name: Render rescue frames
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          mkdir -p out/stills-half out/stills
          npx remotion still src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/stills-half/key_01_hero.png --frame=24 --gl=swangle --scale=0.5
          npx remotion still src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/stills-half/key_02_cutaway.png --frame=102 --gl=swangle --scale=0.5
          npx remotion still src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/stills-half/key_03_technical.png --frame=201 --gl=swangle --scale=0.5
          for f in out/stills-half/*.png; do
            ffmpeg -y -i "$f" -vf scale=1080:1920:flags=lanczos "out/stills/$(basename "$f")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: yunex-orbit-cutaway-rescue-stills
          path: yunex/out/stills
          if-no-files-found: error
          retention-days: 2

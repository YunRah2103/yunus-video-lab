name: YUNEX orbit-cutaway proof fast

on:
  push:
    branches:
      - sol/yunex-orbit-cutaway-proof
    paths:
      - '.github/workflows/yunex-orbit-proof-fast.yml'
  workflow_dispatch:

jobs:
  render-proof-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fit-check dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy trimesh rtree
      - name: Stage approved assets
        run: |
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          cp cars/porsche-911-gt3-rs-992/engine/engine.glb yunex/public/engine.glb
          python yunex/fit_check.py
      - name: Install Remotion dependencies
        working-directory: yunex
        run: npm ci
      - name: Render efficient proof plate
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          mkdir -p out
          npx remotion render src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/proof_half.mp4 --gl=swangle --concurrency=2 --codec=h264 --crf=16 --scale=0.5
          ffmpeg -y -i out/proof_half.mp4 -vf scale=1080:1920:flags=lanczos -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -movflags +faststart out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4
          rm out/proof_half.mp4
          ffmpeg -y -ss 0.8 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_01_hero.png
          ffmpeg -y -ss 3.4 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_02_cutaway.png
          ffmpeg -y -ss 6.7 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_03_technical.png
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,codec_name -of json out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 > out/ffprobe.json
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunex-orbit-cutaway-proof-fast
          path: |
            yunex/out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4
            yunex/out/key_01_hero.png
            yunex/out/key_02_cutaway.png
            yunex/out/key_03_technical.png
            yunex/out/fit-report.json
            yunex/out/ffprobe.json
          if-no-files-found: error
          retention-days: 7

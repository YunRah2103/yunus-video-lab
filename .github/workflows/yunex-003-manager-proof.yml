name: YUNEX 003 manager integration proofs

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - sol/y003-suspension-manager
    paths:
      - 'yunex/src/video003/**'
      - 'yunex/src/index.tsx'
      - '.github/workflows/yunex-003-manager-proof.yml'
  workflow_dispatch:

concurrency:
  group: y003-manager-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json
      - name: Stage locked Porsche
        run: |
          set -euo pipefail
          test "$(sha256sum cars/porsche-911-gt3-rs-992/model.glb | awk '{print $1}')" = "1c73fcb138c31e2b1d5ed126a2412074bb17f8e960b355436f28139bf518e1eb"
          mkdir -p yunex/public yunex/out/y003-manager
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
      - name: Install runtime
        working-directory: yunex
        run: npm ci --no-audit --no-fund
      - name: Bundle and enumerate compositions
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          npx remotion compositions src/index.tsx > out/y003-manager/compositions.txt
          grep -q 'YUNEX-003-VISUAL' out/y003-manager/compositions.txt
          grep -q 'YUNEX-003-FINAL' out/y003-manager/compositions.txt
      - name: Native driving and trackside proof
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-003-VISUAL out/y003-manager/driving-trackside-reduced.mp4 --frames=0-124 --gl=swangle --concurrency=4 --codec=h264 --pixel-format=yuv420p --crf=16 --scale=0.5 --timeout=120000 --muted
      - name: Native moving reveal proof
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-003-VISUAL out/y003-manager/moving-reveal-reduced.mp4 --frames=190-304 --gl=swangle --concurrency=4 --codec=h264 --pixel-format=yuv420p --crf=16 --scale=0.5 --timeout=120000 --muted
      - name: Native installed airflow proof
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          npx remotion render src/index.tsx YUNEX-003-VISUAL out/y003-manager/installed-airflow-reduced.mp4 --frames=260-409 --gl=swangle --concurrency=4 --codec=h264 --pixel-format=yuv420p --crf=16 --scale=0.5 --timeout=120000 --muted
      - name: Seven native milestone frames
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          set -euo pipefail
          for frame in 27 144 234 306 492 603 711; do
            npx remotion still src/index.tsx YUNEX-003-VISUAL "out/y003-manager/frame-${frame}.png" --frame="${frame}" --gl=swangle --scale=1 --timeout=120000
          done
      - name: Probe moving proofs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          for f in yunex/out/y003-manager/*.mp4; do
            ffmpeg -v error -xerror -i "$f" -f null -
            ffprobe -v error -show_entries stream=width,height,r_frame_rate,codec_name -of json "$f"
          done > yunex/out/y003-manager/ffprobe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-003-MANAGER-PROOFS-${{ github.sha }}
          path: yunex/out/y003-manager/
          retention-days: 14
          if-no-files-found: error

name: YUNEX toolkit - integration tests
on:
  push:
    branches: [tooling/remotion-production-suite-20261009]
    paths: ['production/**', 'toolkit/**', 'yunex/src/toolkit/**', '.github/workflows/yunex-toolkit-*.yml', '.github/skills/**', '.github/agents/**', '.github/prompts/**']
  pull_request:
    paths: ['production/**', 'toolkit/**', 'yunex/src/toolkit/**', '.github/workflows/yunex-toolkit-*.yml', '.github/skills/**', '.github/agents/**', '.github/prompts/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: production/requirements-qa.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install actual media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -r production/requirements-qa.txt
      - name: Run migrated Python unit tests
        run: |
          python -m unittest discover -s production/tests -v
          python -m compileall -q production toolkit/smoke
          node --check production/portal/viewer/viewer.mjs
          node --check production/portal/compare/compare.mjs
          python production/tools/catalog.py --site out/toolkit/catalogue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-toolkit-ci-evidence
          path: out/toolkit/
          retention-days: 14
          if-no-files-found: warn
  yunex-native-two-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yunex/package-lock.json
      - name: Install YUNEX existing dependencies without changing lockfile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd yunex
          npm ci --no-audit --no-fund
      - name: Real existing YUNEX composition render and full decode
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/toolkit yunex/public
          # Main does not commit the video footage for YUNEX-001. Stage the already
          # tracked Porsche GLB only inside this ephemeral runner; do not modify it.
          test -s cars/porsche-911-gt3-rs-992/model.glb
          if [ ! -e yunex/public/model.glb ]; then cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb; fi
          python production/tools/render.py --composition RotationPlate --mode preview --output out/toolkit/yunex-native-2f.mp4 --start 0 --end 1 --scale 0.2 --concurrency 1
          python production/tools/quality.py video out/toolkit/yunex-native-2f.mp4 --fps 30 --frames 2 --report out/toolkit/native-qa.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-toolkit-native-two-frame
          path: out/toolkit/
          retention-days: 14
          if-no-files-found: warn

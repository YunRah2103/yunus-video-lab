name: YUNEX orbit-cutaway proof efficient WebGL

on:
  push:
    branches:
      - sol/yunex-orbit-cutaway-proof
    paths:
      - '.github/workflows/yunex-orbit-proof-webgl-half.yml'
  workflow_dispatch:

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: yunex/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fit-check dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy trimesh rtree
      - name: Stage approved assets and inspect fit
        run: |
          cp cars/porsche-911-gt3-rs-992/model.glb yunex/public/model.glb
          cp cars/porsche-911-gt3-rs-992/engine/engine.glb yunex/public/engine.glb
          python yunex/fit_check.py
      - name: Reduce only the internal WebGL buffer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('yunex/src/OrbitCutawayProof.tsx')
          s = p.read_text()
          old = "const cameraState = cameraStateForFrame(frame, duration);"
          new = "const baseCameraState = cameraStateForFrame(frame, duration);\n  const cameraState = {...baseCameraState, zoom:baseCameraState.zoom * 0.5};"
          if old not in s:
              raise SystemExit('ProofScene camera state anchor not found')
          s = s.replace(old, new, 1)
          old_canvas = '<ThreeCanvas width={1080} height={1920} orthographic camera={{position:cameraState.position,zoom:cameraState.zoom,near:0.1,far:100}} gl={{antialias:true,alpha:true,preserveDrawingBuffer:true}}>'
          new_canvas = '<ThreeCanvas width={540} height={960} style={{width:1080,height:1920}} orthographic camera={{position:cameraState.position,zoom:cameraState.zoom*0.5,near:0.1,far:100}} gl={{antialias:true,alpha:true,preserveDrawingBuffer:true}}>'
          if old_canvas not in s:
              raise SystemExit('ThreeCanvas anchor not found')
          s = s.replace(old_canvas, new_canvas, 1)
          p.write_text(s)
          PY
      - name: Install Remotion dependencies
        working-directory: yunex
        run: npm ci
      - name: Render 7.5s 1080x1920 proof
        working-directory: yunex
        env:
          NODE_OPTIONS: --require=./fix-network.cjs
        run: |
          mkdir -p out
          npx remotion render src/index.tsx YUNEX-ORBIT-CUTAWAY-PROOF out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 --gl=swangle --concurrency=2 --codec=h264 --crf=18
          ffmpeg -y -ss 0.8 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_01_hero.png
          ffmpeg -y -ss 3.4 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_02_cutaway.png
          ffmpeg -y -ss 6.7 -i out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 -frames:v 1 out/key_03_technical.png
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate,codec_name -of json out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4 > out/ffprobe.json
      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunex-orbit-cutaway-proof-webgl-half
          path: |
            yunex/out/YUNEX_ORBIT_CUTAWAY_PROOF.mp4
            yunex/out/key_01_hero.png
            yunex/out/key_02_cutaway.png
            yunex/out/key_03_technical.png
            yunex/out/fit-report.json
            yunex/out/ffprobe.json
          if-no-files-found: error
          retention-days: 7
